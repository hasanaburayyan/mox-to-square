[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgsync"
version = "0.1.0"
description = "Moxfield collection export -> Scryfall enrichment -> Square item-library import"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mtgsync = "mtgsync.cli:main"

[tool.setuptools.packages.find]
include = ["mtgsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
